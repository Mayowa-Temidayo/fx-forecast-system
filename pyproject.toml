[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fx-forecast-system"
version = "0.1.0"
description = "Machine Learning FX Forecasting System"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Mayowa Temidayo" }]

dependencies = [
    "catboost>=1.2",
    "joblib>=1.5",
    "lightgbm>=4.6",
    "loguru>=0.7",
    "matplotlib>=3.10",
    "mlflow>=3.1",
    "numpy>=2.2,<2.3",
    "optuna>=4.4",
    "pandas>=2.3",
    "pandas-ta>=0.3.14b0",
    "pandera>=0.26",
    "plotly>=6.3",
    "polars>=1.33",
    "prophet>=1.1",
    "pydantic-settings>=2.10",
    "pyarrow>=21.0",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "shap>=0.49",
    "statsmodels>=0.14",
    "streamlit>=1.48",
    "ta>=0.11",
    "tensorflow>=2.20",
    "xgboost>=3.0",
    "yfinance>=0.2",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyter",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "pyright>=1.1",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fx_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
