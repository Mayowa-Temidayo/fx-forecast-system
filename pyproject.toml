[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fx-forecast-system"
version = "0.1.0"
description = "Production-grade machine learning system for foreign exchange forecasting."
readme = "README.md"
requires-python = ">=3.12,<3.13"

authors = [{ name = "Mayowa Temidayo" }]

dependencies = [
    # Core
    "numpy>=2.1,<2.2",
    "pandas>=2.2,<2.3",
    "pyarrow>=20,<21",
    "polars>=1.33",
    "scipy>=1.15,<1.16",
    # Configuration & Logging
    "loguru>=0.7",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    # Data
    "yfinance>=0.2",
    "pandera>=0.26",
    # Feature Engineering
    "ta>=0.11",
    # Classical Forecasting
    "statsmodels>=0.14",
    "prophet>=1.1",
    # Machine Learning
    "scikit-learn>=1.7",
    "xgboost>=3.0",
    "lightgbm>=4.6",
    "catboost>=1.2",
    "optuna>=4.4",
    "joblib>=1.5",
    # Visualization
    "matplotlib>=3.10",
    "plotly>=6.3",
    "lxml>=6.1.1",
]

[dependency-groups]

dev = [
    "ipykernel>=6.30",
    "jupyter>=1.1",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "pyright>=1.1",
]

tracking = ["mlflow>=3.1"]

explainability = ["shap>=0.49"]

deep-learning = ["tensorflow>=2.19,<2.20"]

dashboard = ["streamlit>=1.48"]

[tool.hatch.build.targets.wheel]
packages = ["src/fx_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
